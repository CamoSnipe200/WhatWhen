<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>&#8203;</title>
  </head>
  <body>
    <div id="app">
      <div id="stage">
        <div id="wheel" class="wheel" hidden></div>
        <div id="stack" class="stack" hidden></div>

        <div id="bubble" class="bubble" hidden>
          <div class="bubble-inner">
            <div class="bubble-header">
              <span id="bubble-swatch" class="swatch"></span>
              <div class="bubble-meta">
                <div id="bubble-title" class="bubble-title"></div>
                <div id="bubble-range" class="bubble-range"></div>
              </div>
            </div>
            <textarea
              id="bubble-input"
              class="bubble-input"
              rows="3"
              maxlength="500"
              placeholder="What did you do?"
              spellcheck="true"
            ></textarea>
            <div id="bubble-hint" class="bubble-hint">Enter to save · Esc keeps pending if empty</div>
          </div>
          <div class="bubble-tail"></div>
        </div>

        <div id="settings" class="settings" hidden>
          <div class="settings-inner">
            <div id="settings-list" class="settings-list"></div>
            <div class="settings-actions">
              <button type="button" id="settings-done" class="btn-primary">Done</button>
            </div>
          </div>
        </div>

        <div id="analysis" class="overlay-panel analysis" hidden>
          <div class="overlay-inner">
            <div class="overlay-header">
              <div class="overlay-title">Analysis</div>
              <button type="button" id="analysis-close" class="overlay-close" aria-label="Close">
                ×
              </button>
            </div>
            <div id="analysis-body" class="analysis-body"></div>
            <div id="analysis-notes" class="analysis-notes" hidden></div>
          </div>
        </div>

        <div id="timeline" class="overlay-panel timeline" hidden>
          <div class="overlay-inner">
            <div class="overlay-header">
              <div class="overlay-title">Timeline</div>
              <button type="button" id="timeline-close" class="overlay-close" aria-label="Close">
                ×
              </button>
            </div>
            <div id="timeline-scroll" class="timeline-scroll">
              <div id="timeline-track" class="timeline-track"></div>
            </div>
            <div id="timeline-hover" class="timeline-hover" hidden></div>
            <div id="timeline-inspector" class="timeline-inspector" hidden></div>
          </div>
        </div>

        <button id="orb" class="orb" type="button">
          <span class="orb-glass"></span>
          <span class="orb-tint" id="orb-tint"></span>
          <span class="orb-ring"></span>
          <!-- Live elapsed — white digits in the orb only while the wheel is open -->
          <span id="live-timer" class="live-timer" aria-hidden="true"></span>
          <span class="orb-badge" id="orb-badge" hidden></span>
        </button>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
