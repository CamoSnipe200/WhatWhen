# Build Windows installer + portable .exe for release tags and attach them.
#
# How to ship:
#   1. Bump version in package.json
#   2. Push a tag such as v1.0.1
#   3. This workflow builds, creates the GitHub Release, and attaches artifacts.
#
# Manual run (no release attachment unless you pass a tag): Actions → Release → Run workflow

name: Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build + package (NSIS installer + portable)
        run: npm run dist
        env:
          # electron-builder may look for this; we upload ourselves below
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WhatWhen-Windows
          path: |
            release/*.exe
            release/latest.yml
          if-no-files-found: error
